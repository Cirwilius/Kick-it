        body { background-color: #1a202c; touch-action: none; }
        #root { width: 100%; height: 100%; }
        canvas { display: block; }
        .custom-scrollbar::-webkit-scrollbar { width: 8px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: rgba(30, 41, 59, 0.5); border-radius: 4px; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: rgba(148, 163, 184, 0.3); border-radius: 4px; }
        .select-none { -webkit-user-select: none; user-select: none; }
        @keyframes fadeInOut {
            0%   { opacity: 0; transform: translateX(-50%) translateY(-10px); }
            15%  { opacity: 1; transform: translateX(-50%) translateY(0); }
            78%  { opacity: 1; transform: translateX(-50%) translateY(0); }
            100% { opacity: 0; transform: translateX(-50%) translateY(-10px); }
        }
        .no-pauses-toast {
            position: absolute; top: 80px; left: 50%; transform: translateX(-50%);
            z-index: 60; pointer-events: none; animation: fadeInOut 2.5s ease forwards;
            font-family: 'Press Start 2P', cursive; font-size: 10px; color: #ffffff;
            background: rgba(15, 20, 30, 0.88); border: 2px solid rgba(255, 255, 255, 0.18);
            border-bottom: 4px solid rgba(255, 255, 255, 0.1); padding: 12px 22px;
            border-radius: 10px; white-space: nowrap; letter-spacing: 0.12em;
            text-shadow: 0 2px 6px rgba(0,0,0,0.8); box-shadow: 0 8px 24px rgba(0,0,0,0.6);
        }
        @keyframes confettiFall {
            0%   { transform: translate3d(0, -25vh, 0) rotate(0deg); opacity: 1; }
            100% { transform: translate3d(0, 125vh, 0) rotate(720deg); opacity: 0.5; }
        }
        @keyframes trophyShine {
            0%, 100% { transform: scale(1) rotate(-4deg); filter: drop-shadow(0 0 20px rgba(255,215,0,0.9)); }
            50%      { transform: scale(1.08) rotate(4deg); filter: drop-shadow(0 0 44px rgba(255,215,0,1)); }
        }
        @keyframes championPop {
            0%   { transform: scale(0.3) rotate(-10deg); opacity: 0; }
            60%  { transform: scale(1.15) rotate(3deg); opacity: 1; }
            100% { transform: scale(1) rotate(0deg); opacity: 1; }
        }
        @keyframes glowPulse {
            0%, 100% { text-shadow: 0 0 20px rgba(255,215,0,0.7), 0 0 40px rgba(255,165,0,0.5), 4px 4px 0 rgba(0,0,0,0.4); }
            50%      { text-shadow: 0 0 32px rgba(255,215,0,1), 0 0 64px rgba(255,165,0,0.85), 4px 4px 0 rgba(0,0,0,0.4); }
        }
    </style>
